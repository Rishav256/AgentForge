table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: triggered_by
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - completed_at
        - created_at
        - started_at
        - status
        - trigger_type
        - id
        - triggered_by
        - workflow_id
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
